<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mafia Control Panel</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --primary: #45f3ff;
            --accent: #ff0055;
            --text: #c5c6c7;
            --text-bright: #ffffff;
            --success: #059212;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        /* Page Management */
        .page {
            display: none;
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            padding: 20px;
            overflow-y: auto;
        }

        .page.active {
            display: block;
        }

        /* Page A: Login */
        #page-login {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #page-login.active {
            display: flex;
        }

        .login-btn-top-left {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: var(--success);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(5, 146, 18, 0.4);
        }

        .login-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(69, 243, 255, 0.2);
            text-align: center;
        }

        .login-card h2 {
            color: var(--primary);
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-bright);
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            color: white;
            font-size: 16px;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .main-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .main-btn:hover {
            box-shadow: 0 0 15px var(--primary);
        }

        /* Page B: Admin Panel */
        #page-admin {
            padding: 0;
        }

        .admin-container {
            display: flex;
            height: 100vh;
        }

        .admin-left, .admin-right {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            height: 100%;
        }

        .admin-left {
            border-right: 1px solid rgba(255,255,255,0.1);
            background: rgba(31, 40, 51, 0.3);
        }

        .admin-section-title {
            color: var(--primary);
            margin-bottom: 20px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 5px;
        }

        .player-row {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            justify-content: space-between;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .player-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background: #444;
        }

        .btn-danger {
            background: var(--accent);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-success-sm {
            background: var(--success);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Page C: Player Cabinet */
        #page-player {
            padding: 0;
            display: none;
            flex-direction: column;
            height: 100vh;
        }

        #page-player.active {
            display: flex;
        }

        .player-header {
            background: var(--card-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .header-profile-img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            object-fit: cover;
        }

        /* Sidebar Trigger and Panel */
        .sidebar-trigger {
            position: fixed;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 15px;
            height: 60px;
            background: var(--primary);
            border-radius: 0 8px 8px 0;
            cursor: pointer;
            z-index: 100;
            opacity: 0.6;
        }

        .sidebar-trigger:hover {
            opacity: 1;
        }

        .sidebar-role-panel {
            position: fixed;
            left: -260px;
            top: 0;
            width: 250px;
            height: 100vh;
            background: #151a21;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
            transition: 0.3s;
            z-index: 99;
            padding: 30px 20px;
        }

        .sidebar-role-panel.open {
            left: 0;
        }

        .role-text-lowercase {
            font-size: 18px;
            color: var(--accent);
            text-transform: lowercase;
            margin-top: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Horizontal Carousel */
        .carousel-container {
            background: #11161d;
            padding: 15px;
            display: flex;
            gap: 15px;
            overflow-x: auto;
            white-space: nowrap;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .carousel-container::-webkit-scrollbar {
            height: 4px;
        }

        .carousel-container::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 2px;
        }

        .carousel-item {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            position: relative;
        }

        .carousel-img {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid transparent;
            transition: 0.2s;
        }

        .carousel-item.selected .carousel-img {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }

        .carousel-name {
            font-size: 12px;
            margin-top: 5px;
            max-width: 65px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Chat Layout */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0d1117;
            overflow: hidden;
        }

        .messages-display {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg-bubble {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 15px;
            line-height: 1.4;
            position: relative;
        }

        .msg-sent {
            background: #056162;
            color: white;
            align-self: flex-end;
        }

        .msg-received {
            background: #262d31;
            color: white;
            align-self: flex-start;
        }

        .msg-meta {
            font-size: 11px;
            color: rgba(255,255,255,0.5);
            margin-top: 4px;
            text-align: right;
            display: block;
        }

        .chat-input-bar {
            background: #1e2428;
            padding: 12px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-input-bar input {
            flex: 1;
            padding: 12px;
            background: #2a2f32;
            border: none;
            border-radius: 20px;
            color: white;
            font-size: 15px;
        }

        .chat-input-bar input:focus {
            outline: none;
        }

        .send-btn {
            background: var(--primary);
            color: black;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Page D: Assignment Dashboard */
        #page-assign {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #page-assign.active {
            display: flex;
        }

        .nav-btn-top-left {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: rgba(255,255,255,0.1);
            color: white;
            padding: 10px 20px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            cursor: pointer;
        }

        .big-circle-btn {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: var(--accent);
            color: white;
            border: none;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.4);
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .big-circle-btn:disabled {
            background: #444;
            color: #777;
            box-shadow: none;
            cursor: not-allowed;
        }

        .timer-display {
            font-size: 48px;
            color: var(--accent);
            margin-top: 25px;
            font-weight: bold;
            height: 60px;
        }

        /* Custom Modal Window */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 1px solid var(--accent);
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
            justify-content: center;
        }

        .modal-btn {
            padding: 10px 25px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .modal-confirm { background: var(--accent); color: white; }
        .modal-cancel { background: #555; color: white; }

        /* Helpers */
        .admin-back-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Səhifə A: Giriş -->
    <div id="page-login" class="page active">
        <button id="btn-goto-assign" class="login-btn-top-left">Vəzifə təyin et</button>
        <div class="login-card">
            <h2>MAFIA LOGİN</h2>
            <div class="input-group">
                <label>İstifadəçi Adı</label>
                <input type="text" id="login-username" placeholder="Adınızı yazın...">
            </div>
            <div class="input-group">
                <label>Şifrə</label>
                <input type="password" id="login-password" placeholder="****">
            </div>
            <button id="btn-submit-login" class="main-btn">DAXİL OL</button>
        </div>
    </div>

    <!-- Səhifə B: Admin Paneli -->
    <div id="page-admin" class="page">
        <div class="admin-container">
            <div class="admin-left">
                <h3 class="admin-section-title">Oyunçu Əlavə Et</h3>
                <div class="input-group">
                    <label>Oyunçu Adı</label>
                    <input type="text" id="admin-p-name">
                </div>
                <div class="input-group">
                    <label>Şifrə</label>
                    <input type="password" id="admin-p-pass">
                </div>
                <div class="input-group">
                    <label>Şəkil Linki (URL)</label>
                    <input type="text" id="admin-p-img" value="https://picsum.photos/100">
                </div>
                <button id="btn-admin-add-player" class="main-btn" style="margin-bottom: 30px;">Oyunçunu Bazaya Yaz</button>

                <h3 class="admin-section-title">Aktiv Oyunçular</h3>
                <div id="admin-active-list"></div>

                <h3 class="admin-section-title" style="margin-top:30px;">Arxiv Siyahısı</h3>
                <div id="admin-archive-list"></div>
            </div>
            <div class="admin-right">
                <h3 class="admin-section-title">Vəzifə Limitləri Parametrləri</h3>
                <div id="role-limits-inputs">
                    <!-- Dinamik limit inputları yüklənəcək -->
                </div>
                <button id="btn-save-role-limits" class="main-btn" style="margin-top:20px;">Limitləri Mentirlə</button>
            </div>
        </div>
        <button id="btn-admin-back-login" class="admin-back-btn">Girişə Qayıt</button>
    </div>

    <!-- Səhifə C: Oyunçu Kabineti -->
    <div id="page-player" class="page">
        <div class="player-header">
            <h3 id="player-cabinet-title">Oyunçu Ekranı</h3>
            <img id="player-profile-img" class="header-profile-img" src="https://picsum.photos/100" alt="Profil">
        </div>

        <!-- Gizli Vəzifə Pəncərəsi Mexanizmi -->
        <div id="sidebar-trigger" class="sidebar-trigger"></div>
        <div id="sidebar-role-panel" class="sidebar-role-panel">
            <h4 style="color: var(--primary); border-bottom: 1px solid #333; padding-bottom: 5px;">Sizin Gizli Rolunuz:</h4>
            <div id="player-role-display" class="role-text-lowercase">yüklənir...</div>
        </div>

        <!-- Horizontal Oyunçu Siyahısı (WhatsApp Stilində Üst Karusel) -->
        <div id="chat-carousel" class="carousel-container"></div>

        <!-- WhatsApp Üslubunda Çat Bölməsi -->
        <div class="chat-area">
            <div id="messages-display" class="messages-display"></div>
            <div class="chat-input-bar">
                <input type="text" id="chat-input-field" placeholder="Mesajınızı bura daxil edin...">
                <button id="btn-send-message" class="send-btn">➤</button>
            </div>
        </div>
    </div>

    <!-- Səhifə D: Vəzifə Təyin Etmə Səhifəsi -->
    <div id="page-assign" class="page">
        <button id="btn-assign-new-game" class="nav-btn-top-left">Yeni Oyun</button>
        <button id="btn-assign-back-login" class="nav-btn-top-left" style="left: auto; right: 20px;">Giriş Səhifəsi</button>
        
        <button id="btn-start-assignment" class="big-circle-btn">VƏZİFƏLƏRİ TƏYİN ET</button>
        <div id="countdown-timer" class="timer-display"></div>
    </div>

    <!-- Təsdiq Modalı (Yeni Oyun üçün) -->
    <div id="confirm-modal" class="modal-overlay">
        <div class="modal-box">
            <h3 style="color:white; margin-bottom: 15px;">Xəbərdarlıq</h3>
            <p>Əminsinizmi? Bu əməliyyat bütün aktiv rolları tamamilə sıfırlayacaq!</p>
            <div class="modal-buttons">
                <button id="btn-modal-yes" class="modal-btn modal-confirm">Bəli</button>
                <button id="btn-modal-no" class="modal-btn modal-cancel">Xeyr</button>
            </div>
        </div>
    </div>

    <!-- Firebase və Proqram Məntiqi -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, update, onValue, push, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // İstifadəçinin rəsmi koordinatları və konfiqurasiyası
        const firebaseConfig = {
            databaseURL: "https://mafia-game-b6bf7-default-rtdb.europe-west1.firebasedatabase.app"
        };

        // Firebase Təşəbbüsü
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Qlobal Cari İstifadəçi Vəziyyəti
        let currentLoggedInUser = null;
        let selectedTargetPlayers = []; // Çat üçün çoxlu seçim massivi

        // Defolt Rol Limitləri Arxivi
        const defaultRoleLimits = { "Mafia": 1, "Don": 1, "Həkim": 1, "Komissar": 1, "Sivil": 4 };

        // Səhifə Dəyişmə İdarəçisi (CSS .active mexanizmi ilə təhlükəsiz keçid)
        function navigateToPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const target = document.getElementById(pageId);
            if(target) target.classList.add('active');
        }

        // --- DOM ELEMENTLƏRİNİN BAĞLANMASI (ADD_EVENT_LISTENER) ---
        document.addEventListener("DOMContentLoaded", () => {
            
            // Keçid düymələri
            document.getElementById('btn-goto-assign').addEventListener('click', () => navigateToPage('page-assign'));
            document.getElementById('btn-admin-back-login').addEventListener('click', () => navigateToPage('page-login'));
            document.getElementById('btn-assign-back-login').addEventListener('click', () => navigateToPage('page-login'));

            // Giriş Əməliyyatı
            document.getElementById('btn-submit-login').addEventListener('click', handleLoginExecution);

            // Admin Əməliyyatları
            document.getElementById('btn-admin-add-player').addEventListener('click', addNewPlayerToDatabase);
            document.getElementById('btn-save-role-limits').addEventListener('click', saveRoleLimitsToDatabase);

            // Kabinet Elementləri
            document.getElementById('sidebar-trigger').addEventListener('click', () => {
                document.getElementById('sidebar-role-panel').classList.toggle('open');
            });
            document.getElementById('btn-send-message').addEventListener('click', sendChatMessage);

            // Vəzifə Bölməsi Elementləri
            document.getElementById('btn-start-assignment').addEventListener('click', triggerFisherYatesAssignment);
            document.getElementById('btn-assign-new-game').addEventListener('click', () => {
                document.getElementById('confirm-modal').classList.add('active');
            });
            document.getElementById('btn-modal-no').addEventListener('click', () => {
                document.getElementById('confirm-modal').classList.remove('active');
            });
            document.getElementById('btn-modal-yes').addEventListener('click', resetAllRolesAction);

            // Dinamik Məlumat Axınını Başlatmaq
            initializeLiveSyncData();
            ensureDatabaseDefaults();
        });

        // Verilənlər Bazasının İlkin Qurulması
        async function ensureDatabaseDefaults() {
            const limitSnapshot = await get(ref(db, 'roleLimits'));
            if (!limitSnapshot.exists()) {
                await set(ref(db, 'roleLimits'), defaultRoleLimits);
            }
        }

        // CANLI SİNXRONDURMA (Realtime Listeners)
        function initializeLiveSyncData() {
            // Oyunçu Siyahısı Yeniləndikdə (Admin və Çat üçün)
            onValue(ref(db, 'players'), (snapshot) => {
                const data = snapshot.val() || {};
                renderAdminPlayerLists(data);
                renderChatCarousel(data);
                updateAssignmentButtonState(data);
            });

            // Rol limitləri dəyişdikdə Admin panelinin sağ tərəfini doldur
            onValue(ref(db, 'roleLimits'), (snapshot) => {
                const limits = snapshot.val() || defaultRoleLimits;
                renderRoleLimitsInputs(limits);
            });

            // Çat Mesajları Canlı İzləmə
            onValue(ref(db, 'messages'), (snapshot) => {
                const msgs = snapshot.val() || {};
                renderChatMessages(msgs);
            });
        }

        // GİRİŞ MƏNTİQİ (Giriş Yoxlanışı)
        async function handleLoginExecution() {
            const userText = document.getElementById('login-username').value.trim();
            const passText = document.getElementById('login-password').value.trim();

            if(!userText || !passText) {
                alert("Zəhmət olmasa bütün xanaları doldurun!");
                return;
            }

            // Admin Giriş Yoxlanışı
            if(userText === "Admin" && passText === "9060") {
                navigateToPage('page-admin');
                return;
            }

            // Oyunçu Giriş Yoxlanışı
            const playerSnapshot = await get(ref(db, `players/${userText}`));
            if(playerSnapshot.exists()) {
                const playerData = playerSnapshot.val();
                if(playerData.status === "active" && playerData.password === passText) {
                    currentLoggedInUser = userText;
                    document.getElementById('player-cabinet-title').innerText = `Kabinet: ${userText}`;
                    document.getElementById('player-profile-img').src = playerData.avatar || 'https://picsum.photos/100';
                    
                    // Rolunu təyin et və izlə
                    onValue(ref(db, `players/${userText}/role`), (roleSnap) => {
                        const rVal = roleSnap.val() || "təyin edilməyib";
                        document.getElementById('player-role-display').innerText = rVal;
                    });

                    navigateToPage('page-player');
                } else {
                    alert("Şifrə yanlışdır və ya istifadəçi silinib!");
                }
            } else {
                alert("Belə bir oyunçu tapılmadı!");
            }
        }

        // ADMİN: OYUNÇU ƏLAVƏ ETMƏK
        async function addNewPlayerToDatabase() {
            const name = document.getElementById('admin-p-name').value.trim();
            const pass = document.getElementById('admin-p-pass').value.trim();
            const img = document.getElementById('admin-p-img').value.trim();

            if(!name || !pass) {
                alert("Ad və şifrə mütləqdir!");
                return;
            }

            await set(ref(db, `players/${name}`), {
                password: pass,
                avatar: img || "https://picsum.photos/100",
                status: "active",
                role: "təyin edilməyib"
            });

            document.getElementById('admin-p-name').value = "";
            document.getElementById('admin-p-pass').value = "";
        }

        // ADMİN: AKTİV VƏ ARXİV SİYAHISININ RENDERİ
        function renderAdminPlayerLists(playersObj) {
            const activeDiv = document.getElementById('admin-active-list');
            const archiveDiv = document.getElementById('admin-archive-list');

            activeDiv.innerHTML = "";
            archiveDiv.innerHTML = "";

            for(let username in playersObj) {
                const p = playersObj[username];
                
                const row = document.createElement('div');
                row.className = "player-row";
                
                const info = document.createElement('div');
                info.className = "player-info";
                
                const img = document.createElement('img');
                img.className = "player-avatar";
                img.src = p.avatar || "https://picsum.photos/100";
                
                const txt = document.createElement('span');
                txt.innerHTML = `<strong>${username}</strong> (${p.role || 'yoxdur'})`;
                
                info.appendChild(img);
                info.appendChild(txt);
                row.appendChild(info);

                if(p.status === "active") {
                    const delBtn = document.createElement('button');
                    delBtn.className = "btn-danger";
                    delBtn.innerText = "Sil / Arxivlə";
                    delBtn.addEventListener('click', () => {
                        update(ref(db, `players/${username}`), { status: "archived" });
                    });
                    row.appendChild(delBtn);
                    activeDiv.appendChild(row);
                } else {
                    const restoreBtn = document.createElement('button');
                    restoreBtn.className = "btn-success-sm";
                    restoreBtn.innerText = "Bərpa et";
                    restoreBtn.addEventListener('click', () => {
                        update(ref(db, `players/${username}`), { status: "active" });
                    });
                    row.appendChild(restoreBtn);
                    archiveDiv.appendChild(row);
                }
            }
        }

        // ADMİN: VƏZİFƏ LİMİTLƏRİ INPUTLARININ QURULMASI
        function renderRoleLimitsInputs(limits) {
            const container = document.getElementById('role-limits-inputs');
            container.innerHTML = "";
            for(let role in limits) {
                const group = document.createElement('div');
                group.className = "input-group";
                group.innerHTML = `
                    <label>${role} sayı</label>
                    <input type="number" data-role="${role}" value="${limits[role]}" min="0">
                `;
                container.appendChild(group);
            }
        }

        // ADMİN: LİMİTLƏRİ YADDA SAXLAMAQ
        async function saveRoleLimitsToDatabase() {
            const inputs = document.querySelectorAll('#role-limits-inputs input');
            const newLimits = {};
            inputs.forEach(inp => {
                newLimits[inp.getAttribute('data-role')] = parseInt(inp.value) || 0;
            });
            await set(ref(db, 'roleLimits'), newLimits);
            alert("Limit ayarları uğurla güncəlləndi!");
        }

        // SƏHİFƏ D: DÜYMƏNİN MİNİMUM 5 OYUNÇU YOXLANMASI VƏZİYYƏTİ
        function updateAssignmentButtonState(playersObj) {
            let activeCount = 0;
            for(let k in playersObj) {
                if(playersObj[k].status === "active") activeCount++;
            }
            const btn = document.getElementById('btn-start-assignment');
            if(btn) {
                if(activeCount >= 5) {
                    btn.disabled = false;
                    btn.innerText = "VƏZİFƏLƏRİ TƏYİN ET";
                } else {
                    btn.disabled = true;
                    btn.innerText = `Oyunçu azdır (${activeCount}/5)`;
                }
            }
        }

        // SƏHİFƏ D: FISHER-YATES ALQORİTMİ VƏ GERİ SAYIM
        async function triggerFisherYatesAssignment() {
            const btn = document.getElementById('btn-start-assignment');
            const timerDiv = document.getElementById('countdown-timer');
            
            btn.disabled = true;
            let countdown = 5;
            timerDiv.innerText = countdown;

            const interval = setInterval(async () => {
                countdown--;
                if(countdown <= 0) {
                    clearInterval(interval);
                    timerDiv.innerText = "Tamamlandı!";
                    
                    // Alqoritmi İcra et
                    await executeRoleShufflingLogic();
                    
                    btn.disabled = false;
                } else {
                    timerDiv.innerText = countdown;
                }
            }, 1000);
        }

        // ROL PAYLANMA ALQORİTMİ İCRA MEXANİZMİ
        async function executeRoleShufflingLogic() {
            const playersSnapshot = await get(ref(db, 'players'));
            const limitsSnapshot = await get(ref(db, 'roleLimits'));

            if(!playersSnapshot.exists()) return;
            
            const players = playersSnapshot.val();
            const limits = limitsSnapshot.val() || defaultRoleLimits;

            // Aktiv oyunçuları massivə yığmaq
            let activeUsernames = [];
            for(let name in players) {
                if(players[name].status === "active") {
                    activeUsernames.push(name);
                }
            }

            // Rol hovuzunu limitlərə görə formalaşdırmaq
            let rolePool = [];
            for(let role in limits) {
                for(let i = 0; i < limits[role]; i++) {
                    rolePool.push(role);
                }
            }

            // Əgər rol hovuzu aktiv oyunçulardan azdırsa, qalanını sivil ilə doldur
            while(rolePool.length < activeUsernames.length) {
                rolePool.push("Sivil");
            }

            // Fisher-Yates Qarışdırma Alqoritmi
            for (let i = rolePool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [rolePool[i], rolePool[j]] = [rolePool[j], rolePool[i]];
            }

            // Verilənlər bazasına rolları tək-tək ötürmək
            const updates = {};
            activeUsernames.forEach((user, index) => {
                updates[`players/${user}/role`] = rolePool[index];
            });

            await update(ref(db), updates);
        }

        // SƏHİFƏ D: YENİ OYUN (Sıfırlama funksiyası)
        async function resetAllRolesAction() {
            document.getElementById('confirm-modal').classList.remove('active');
            const playersSnapshot = await get(ref(db, 'players'));
            if(playersSnapshot.exists()) {
                const players = playersSnapshot.val();
                const updates = {};
                for(let name in players) {
                    updates[`players/${name}/role`] = "təyin edilməyib";
                }
                // Mesaj arxivini də silmək olar
                await update(ref(db), updates);
                await set(ref(db, 'messages'), null); 
                alert("Bütün rollar və mesajlar sıfırlandı!");
            }
        }

        // KABİNET: WHATSAPP STİLİNDƏ HORIZONTAL KARUSEL RENDİRİ
        function renderChatCarousel(playersObj) {
            const container = document.getElementById('chat-carousel');
            container.innerHTML = "";

            // Toplu mesajlaşma üçün hamını seçmək imkanı yaradan universal element
            const allItem = document.createElement('div');
            allItem.className = `carousel-item ${selectedTargetPlayers.length === 0 ? 'selected' : ''}`;
            allItem.innerHTML = `
                <img class="carousel-img" src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=100" style="background:#45f3ff;">
                <span class="carousel-name">Hamiya</span>
            `;
            allItem.addEventListener('click', () => {
                selectedTargetPlayers = []; // Boş massiv hamı deməkdir
                document.querySelectorAll('.carousel-item').forEach(i => i.classList.remove('selected'));
                allItem.classList.add('selected');
            });
            container.appendChild(allItem);

            for(let name in playersObj) {
                const p = playersObj[name];
                if(p.status !== "active" || name === currentLoggedInUser) continue;

                const item = document.createElement('div');
                item.className = `carousel-item ${selectedTargetPlayers.includes(name) ? 'selected' : ''}`;
                
                const img = document.createElement('img');
                img.className = "carousel-img";
                img.src = p.avatar || "https://picsum.photos/100";
                
                const label = document.createElement('span');
                label.className = "carousel-name";
                label.innerText = name;

                item.appendChild(img);
                item.appendChild(label);

                item.addEventListener('click', () => {
                    allItem.classList.remove('selected');
                    if(selectedTargetPlayers.includes(name)) {
                        selectedTargetPlayers = selectedTargetPlayers.filter(x => x !== name);
                        item.classList.remove('selected');
                        if(selectedTargetPlayers.length === 0) allItem.classList.add('selected');
                    } else {
                        selectedTargetPlayers.push(name);
                        item.classList.add('selected');
                    }
                });

                container.appendChild(item);
            }
        }

        // KABİNET: ÇAT MESAJLARINI GÖNDƏRMƏK
        async function sendChatMessage() {
            const input = document.getElementById('chat-input-field');
            const txt = input.value.trim();
            if(!txt || !currentLoggedInUser) return;

            const msgData = {
                sender: currentLoggedInUser,
                text: txt,
                timestamp: Date.now(),
                targets: selectedTargetPlayers // Əgər boşdursa hamıya görünəcək, doludursa fərdi/toplu özəldir
            };

            const newMsgRef = push(ref(db, 'messages'));
            await set(newMsgRef, msgData);
            input.value = "";
        }

        // KABİNET: ÇAT MESAJLARININ CANLI RENDİRİ (GİZLİLİK FILTRASI ILE)
        function renderChatMessages(messagesObj) {
            const display = document.getElementById('messages-display');
            display.innerHTML = "";

            for(let id in messagesObj) {
                const m = messagesObj[id];
                
                // Gizlilik Qaydası: Mesaj hamıya göndərilibsə, YA DA göndərən/hədəf mənəmsə görsənsin
                const isGeneral = !m.targets || m.targets.length === 0;
                const iAmSender = m.sender === currentLoggedInUser;
                const iAmTarget = m.targets && m.targets.includes(currentLoggedInUser);

                if(!isGeneral && !iAmSender && !iAmTarget) continue;

                const bubble = document.createElement('div');
                bubble.className = `msg-bubble ${iAmSender ? 'msg-sent' : 'msg-received'}`;
                
                let targetPrefix = "";
                if(!isGeneral) {
                    targetPrefix = `<span style="color:var(--primary); font-size:11px; display:block;">[Özəl Mesaj -> ${m.targets.join(', ')}]</span>`;
                }

                const timeString = new Date(m.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                bubble.innerHTML = `
                    ${targetPrefix}
                    <strong>${m.sender}:</strong> ${m.text}
                    <span class="msg-meta">${timeString}</span>
                `;
                
                display.appendChild(bubble);
            }
            display.scrollTop = display.scrollHeight; // Avtomatik aşağı sürüşmə
        }
    </script>
