<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mafia Premium Control</title>
    <!-- Firebase SDK v9 (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0a0a0a; color: #e0e0e0; min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .page { display: none; width: 100vw; height: 100vh; position: relative; }
        .page.active { display: flex; flex-direction: column; }
        
        /* Səhifə A: Giriş */
        #page-a { background: radial-gradient(circle, #1a1a1a 0%, #050505 100%); justify-content: center; align-items: center; }
        .login-btn-top { position: absolute; top: 15px; left: 15px; background: #27ae60; color: white; border: none; padding: 10px 15px; font-weight: bold; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 14px; z-index: 10; }
        .login-box { background: rgba(20, 20, 20, 0.9); padding: 30px; border-radius: 8px; border: 1px solid #333; width: 90%; max-width: 360px; box-shadow: 0 10px 25px rgba(0,0,0,0.7); text-align: center; }
        .login-box h2 { margin-bottom: 20px; color: #ff3333; letter-spacing: 2px; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; background: #222; border: 1px solid #444; color: white; border-radius: 4px; font-size: 16px; }
        .login-box button { width: 100%; padding: 12px; background: #ff3333; border: none; color: white; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 16px; }
        
        /* Səhifə B: Admin Paneli */
        #page-b { display: none; flex-direction: row; height: 100vh; }
        #page-b.active { display: flex; }
        .admin-left, .admin-right { width: 50%; height: 100%; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .admin-left { border-right: 1px solid #333; background: #111; }
        .admin-right { background: #151515; }
        .admin-section { background: #1e1e1e; padding: 15px; border-radius: 6px; border: 1px solid #2a2a2a; }
        .admin-section h3 { margin-bottom: 10px; color: #ff3333; border-bottom: 1px solid #333; padding-bottom: 5px; font-size: 16px; }
        .admin-form input { width: 100%; padding: 8px; margin-bottom: 8px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 4px; }
        .admin-form button, .btn-action { width: 100%; padding: 10px; background: #27ae60; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn-action.danger { background: #c0392b; }
        .player-item, .archive-item, .role-item { display: flex; align-items: center; justify-content: space-between; background: #252525; padding: 8px; border-radius: 4px; margin-bottom: 5px; font-size: 14px; }
        .player-item img, .archive-item img { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; margin-right: 10px; }
        .player-info { display: flex; align-items: center; }
        .btn-mini { padding: 4px 8px; background: #c0392b; border: none; color: white; border-radius: 3px; cursor: pointer; font-size: 12px; }
        .btn-mini.restore { background: #2980b9; }
        .role-controls { display: flex; align-items: center; gap: 5px; }
        .role-controls button { width: 25px; height: 25px; background: #444; border: none; color: white; font-weight: bold; border-radius: 3px; cursor: pointer; }
        
        /* Kamera Bölməsi */
        .camera-container { display: none; flex-direction: column; align-items: center; gap: 10px; background: #222; padding: 10px; border-radius: 6px; margin-top: 5px; }
        #video { width: 100%; max-width: 240px; background: #000; border-radius: 4px; transform: scaleX(-1); }
        .camera-btns { display: flex; gap: 10px; width: 100%; }
        .camera-btns button { flex: 1; padding: 8px; font-size: 12px; }
        .img-preview { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; display: none; margin: 5px auto; border: 1px solid #555; }

        /* Səhifə C: Oyunçu Kabineti */
        #page-c { background: #0e1621; height: 100vh; overflow: hidden; display: none; }
        #page-c.active { display: flex; flex-direction: column; }
        .player-header { height: 60px; background: #17212b; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; border-bottom: 1px solid #101921; }
        .player-header h2 { font-size: 18px; color: #fff; }
        .player-header img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #5288c1; object-fit: cover; }
        
        /* Gizli Rol Pəncərəsi (Milli Ölçülər: 25mm x 13mm) */
        .sidebar-trigger { position: absolute; left: 0; top: 35%; width: 15px; height: 60px; background: #24303f; border-radius: 0 8px 8px 0; border: 1px solid #313e4f; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #888; font-size: 12px; z-index: 99; touch-action: none; }
        .sidebar-panel { position: absolute; left: -100px; top: 35%; width: 13mm; height: 25mm; background: #17212b; border: 1px solid #ff3333; box-shadow: 5px 0 15px rgba(0,0,0,0.5); z-index: 98; border-radius: 0 6px 6px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: left 0.2s ease; overflow: hidden; }
        .sidebar-panel.open { left: 0; }
        .role-text-vertical { display: flex; flex-direction: column; align-items: center; justify-content: center; text-transform: uppercase; color: #ff3333; font-weight: bold; font-size: 10px; line-height: 1.1; letter-spacing: 0px; text-align: center; }

        /* Horizontal Oyunçu Siyahısı */
        .horizontal-list { height: 75px; background: #17212b; display: flex; align-items: center; gap: 15px; padding: 0 15px; overflow-x: auto; border-bottom: 1px solid #101921; scrollbar-width: none; }
        .horizontal-list::-webkit-scrollbar { display: none; }
        .hz-player-card { display: flex; flex-direction: column; align-items: center; cursor: pointer; min-width: 50px; position: relative; }
        .hz-player-card img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid transparent; transition: border-color 0.2s; }
        .hz-player-card.selected img { border-color: #ff3333; }
        .hz-player-card span { font-size: 11px; color: #7f91a4; margin-top: 4px; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; max-width: 55px; }

        /* Çat Mesaj Sahəsi (Mobil Tam Optimizasiya) */
        .chat-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-repeat: repeat; }
        .msg { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.4; position: relative; word-break: break-word; }
        .msg.incoming { background: #182533; align-self: flex-start; color: #fff; border-bottom-left-radius: 2px; }
        .msg.outgoing { background: #2b5278; align-self: flex-end; color: #fff; border-bottom-right-radius: 2px; }
        .msg .msg-meta { font-size: 10px; color: #7f91a4; display: block; margin-bottom: 2px; font-weight: bold; }
        .msg .msg-target { font-size: 9px; color: #ff8888; font-style: italic; display: block; margin-top: 3px; }
        .msg .msg-time { font-size: 9px; color: #a1b2c4; text-align: right; display: block; margin-top: 2px; }

        .chat-input-bar { height: 60px; background: #17212b; display: flex; align-items: center; padding: 0 10px; gap: 10px; border-top: 1px solid #101921; position: relative; }
        .chat-input-bar input { flex: 1; padding: 12px; background: #24303f; border: none; color: white; border-radius: 20px; font-size: 15px; outline: none; }
        .chat-input-bar button { width: 45px; height: 45px; background: #5288c1; border: none; color: white; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }

        /* Səhifə D: Vəzifə Təyin Etmə */
        #page-d { background: #0c0c0c; justify-content: center; align-items: center; }
        .btn-back-a { position: absolute; top: 15px; left: 15px; background: #444; color: white; border: none; padding: 10px 15px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .btn-new-game { position: absolute; top: 15px; right: 15px; background: #7f8c8d; color: white; border: none; padding: 10px 15px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .main-trigger-btn { width: 180px; height: 180px; border-radius: 50%; background: #c0392b; border: 8px solid #962d22; color: white; font-weight: bold; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; text-align: center; box-shadow: 0 0 30px rgba(192,57,43,0.5); transition: all 0.3s; user-select: none; }
        .main-trigger-btn:disabled { background: #3a3a3a !important; border-color: #2b2b2b !important; color: #777 !important; cursor: not-allowed; box-shadow: none !important; }
        
        /* Böyük Transparent Geri Sayım Overlay */
        .countdown-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.1); display: none; justify-content: center; align-items: center; z-index: 9999; pointer-events: none; }
        .countdown-number { font-size: 140px; font-weight: 900; color: #ff3333; text-shadow: 0 0 40px rgba(255,51,51,0.8); font-family: Impact, sans-serif; }
        .start-announcement { font-size: 45px; font-weight: bold; color: #27ae60; text-shadow: 0 0 30px rgba(39,174,96,0.8); text-align: center; display: none; font-family: 'Arial Black', sans-serif; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10000; width: 90%; pointer-events: none; }

        /* Modal */
        .modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-box { background: #222; padding: 25px; border-radius: 6px; width: 280px; text-align: center; border: 1px solid #444; }
        .modal-box p { margin-bottom: 20px; font-size: 16px; }
        .modal-btns { display: flex; gap: 10px; }
        .modal-btns button { flex: 1; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-yes { background: #c0392b; color: white; }
        .btn-no { background: #7f8c8d; color: white; }

        @media (max-width: 600px) {
            #page-b { flex-direction: column; }
            .admin-left, .admin-right { width: 100%; height: 50%; }
            .countdown-number { font-size: 100px; }
            .start-announcement { font-size: 32px; }
        }
    </style>
</head>
<body>

    <div id="page-a" class="page active">
        <button id="nav-to-d-btn" class="login-btn-top">Vəzifə təyin et</button>
        <div class="login-box">
            <h2>MAFIA LOG IN</h2>
            <input type="text" id="login-username" placeholder="Adınız">
            <input type="password" id="login-password" placeholder="Şifrəniz">
            <button id="login-submit-btn">Daxil ol</button>
        </div>
    </div>

    <div id="page-b" class="page">
        <div class="admin-left">
            <div class="admin-section">
                <h3>Oyunçu Əlavə Et</h3>
                <div class="admin-form">
                    <input type="text" id="p-name" placeholder="Oyunçu Adı">
                    <input type="password" id="p-pass" placeholder="Şifrə">
                    
                    <button id="camera-toggle-btn" style="background:#34495e; margin-bottom:5px;">📷 Şəkil Çək</button>
                    <div class="camera-container" id="cam-block">
                        <video id="video" autoplay playsinline></video>
                        <canvas id="canvas" style="display:none;"></canvas>
                        <div class="camera-btns">
                            <button id="snap-btn" style="background:#e67e22; color:white; border:none; border-radius:3px;">Çək</button>
                            <button id="retake-btn" style="background:#7f8c8d; color:white; border:none; border-radius:3px; display:none;">Yenidən</button>
                        </div>
                    </div>
                    <img id="captured-preview" class="img-preview" src="">
                    <button id="add-player-btn">Sistemə Daxil Et</button>
                </div>
            </div>
            <div class="admin-section" style="flex:1;">
                <h3>Aktiv Oyunçular</h3>
                <div id="active-players-list"></div>
            </div>
            <div class="admin-section">
                <h3>Arxiv Bazası</h3>
                <div id="archive-players-list"></div>
            </div>
            <button id="logout-b-btn" class="btn-action danger">Çıxış</button>
        </div>
        <div class="admin-right">
            <div class="admin-section" style="flex:1;">
                <h3>Vəzifə Limitləri Siyahısı</h3>
                <div id="roles-config-list"></div>
                <div style="margin-top:15px; display:flex; gap:5px;">
                    <input type="text" id="new-role-name" placeholder="Yeni Vəzifə Adı" style="flex:1; padding:8px; background:#2a2a2a; border:1px solid #444; color:white; border-radius:4px;">
                    <button id="add-custom-role-btn" style="padding:0 15px; background:#2980b9; color:white; border:none; border-radius:4px; font-weight:bold; cursor:pointer;">+ Yeni Ad</button>
                </div>
            </div>
        </div>
    </div>

    <div id="page-c" class="page">
        <div class="player-header">
            <h2 id="cabinet-title">Oyunçu Kabineti</h2>
            <img id="cabinet-avatar" src="https://via.placeholder.com/150" alt="Avatar">
        </div>
        
        <div id="sidebar-trigger" class="sidebar-trigger">▶</div>
        <div id="sidebar-panel" class="sidebar-panel">
            <div class="role-text-vertical" id="cabinet-role-box">B<br>O<br>Ş<br>D<br>U<br>R</div>
        </div>

        <div class="horizontal-list" id="hz-chat-list"></div>

        <div class="chat-area" id="chat-messages-container"></div>

        <div class="chat-input-bar">
            <input type="text" id="chat-input-field" placeholder="Mesajınızı yazın...">
            <button id="chat-send-btn">➔</button>
        </div>
    </div>

    <div id="page-d" class="page">
        <button id="back-to-a-btn" class="btn-back-a">Geri</button>
        <button id="new-game-btn" class="btn-new-game">Yeni Oyun</button>
        <button id="main-distribute-btn" class="main-trigger-btn">VƏZİFƏLƏRİ TƏYİN ET</button>
    </div>

    <div class="countdown-overlay" id="global-countdown-overlay">
        <div class="countdown-number" id="global-countdown-num">5</div>
    </div>
    <div class="start-announcement" id="global-start-banner">OYUN BAŞLADI, UĞULAR</div>

    <div class="modal" id="confirm-modal">
        <div class="modal-box">
            <p>Əminsinizmi? Bütün rollar və çat sıfırlanacaq.</p>
            <div class="modal-btns">
                <button class="btn-yes" id="modal-yes">Bəli</button>
                <button class="btn-no" id="modal-no">Xeyr</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. FIREBASE QURULUMU (mafia-game-b6bf7, Belgium) ---
        const firebaseConfig = {
            databaseURL: "https://mafia-game-b6bf7-default-rtdb.europe-west1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- 2. DEYİŞƏNLƏR VƏ SEÇİCİLƏR ---
        let currentUsername = "";
        let selectedTargets = []; 
        let localPhotoBase64 = ""; 
        let streamRef = null;

        const pages = {
            A: document.getElementById('page-a'),
            B: document.getElementById('page-b'),
            C: document.getElementById('page-c'),
            D: document.getElementById('page-d')
        };

        function showPage(pageKey) {
            Object.values(pages).forEach(p => p.classList.remove('active'));
            pages[pageKey].classList.add('active');
            if (pageKey !== 'B') stopCamera();
        }

        // --- 3. DÜYMƏ EVENT BAĞLANTILARI ---
        document.getElementById('nav-to-d-btn').addEventListener('click', () => showPage('D'));
        document.getElementById('back-to-a-btn').addEventListener('click', () => showPage('A'));
        document.getElementById('logout-b-btn').addEventListener('click', () => { currentUsername = ""; showPage('A'); });
        
        document.getElementById('login-submit-btn').addEventListener('click', () => {
            const u = document.getElementById('login-username').value.trim();
            const p = document.getElementById('login-password').value.trim();
            if (!u || !p) return;

            if (u === 'Admin' && p === '9060') {
                currentUsername = "Admin";
                showPage('B');
                return;
            }

            db.ref('players/' + u).once('value', snap => {
                const userData = snap.val();
                if (userData && userData.password === p && userData.status === "active") {
                    currentUsername = u;
                    document.getElementById('cabinet-title').innerText = u;
                    document.getElementById('cabinet-avatar').src = userData.photo || "https://via.placeholder.com/150";
                    showPage('C');
                    listenToCabinetRole();
                } else {
                    alert("Ad və ya şifrə yanlışdır, yaxud oyunçu silinib!");
                }
            });
        });

        // --- 4. SƏHİFƏ B: ADMIN PANELI ---
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const camBlock = document.getElementById('cam-block');
        const snapBtn = document.getElementById('snap-btn');
        const retakeBtn = document.getElementById('retake-btn');
        const previewImg = document.getElementById('captured-preview');

        document.getElementById('camera-toggle-btn').addEventListener('click', async () => {
            if (camBlock.style.display === 'flex') {
                stopCamera();
            } else {
                camBlock.style.display = 'flex';
                try {
                    streamRef = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                    video.srcObject = streamRef;
                } catch (err) {
                    alert("Kamera açıla bilmədi: " + err.message);
                }
            }
        });

        snapBtn.addEventListener('click', () => {
            if (!streamRef) return;
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            localPhotoBase64 = canvas.toDataURL('image/jpeg', 0.7);
            previewImg.src = localPhotoBase64;
            previewImg.style.display = 'block';
            video.style.display = 'none';
            snapBtn.style.display = 'none';
            retakeBtn.style.display = 'block';
        });

        retakeBtn.addEventListener('click', () => {
            localPhotoBase64 = "";
            previewImg.style.display = 'none';
            video.style.display = 'block';
            snapBtn.style.display = 'block';
            retakeBtn.style.display = 'none';
        });

        function stopCamera() {
            if (streamRef) {
                streamRef.getTracks().forEach(track => track.stop());
                streamRef = null;
            }
            video.srcObject = null;
            camBlock.style.display = 'none';
            video.style.display = 'block';
            snapBtn.style.display = 'block';
            retakeBtn.style.display = 'none';
            previewImg.style.display = 'none';
            localPhotoBase64 = "";
        }

        document.getElementById('add-player-btn').addEventListener('click', () => {
            const name = document.getElementById('p-name').value.trim();
            const pass = document.getElementById('p-pass').value.trim();
            if (!name || !pass) { alert("Ad və şifrə mütləqdir!"); return; }

            const finalPhoto = localPhotoBase64 || "https://via.placeholder.com/150";

            db.ref('players/' + name).set({
                name: name,
                password: pass,
                photo: finalPhoto,
                status: "active",
                role: "Boşdur"
            }).then(() => {
                document.getElementById('p-name').value = "";
                document.getElementById('p-pass').value = "";
                stopCamera();
            });
        });

        document.getElementById('add-custom-role-btn').addEventListener('click', () => {
            const rName = document.getElementById('new-role-name').value.trim();
            if (!rName) return;
            db.ref('roles_config/' + rName).set(1).then(() => {
                document.getElementById('new-role-name').value = "";
            });
        });

        db.ref('players').on('value', snap => {
            const players = snap.val() || {};
            const activeDiv = document.getElementById('active-players-list');
            const archiveDiv = document.getElementById('archive-players-list');
            activeDiv.innerHTML = "";
            archiveDiv.innerHTML = "";
            let activeCount = 0;

            Object.keys(players).forEach(key => {
                const p = players[key];
                if (p.status === "active") {
                    activeCount++;
                    const item = document.createElement('div');
                    item.className = 'player-item';
                    item.innerHTML = `
                        <div class="player-info">
                            <img src="${p.photo}" alt="p">
                            <div><strong>${p.name}</strong> <br><small style="color:#aaa;">Rol: ${p.role || 'Boşdur'}</small></div>
                        </div>
                        <button class="btn-mini" data-id="${p.name}">Sil</button>
                    `;
                    item.querySelector('.btn-mini').addEventListener('click', () => {
                        db.ref('players/' + p.name).update({ status: "archived" });
                    });
                    activeDiv.appendChild(item);
                } else {
                    const item = document.createElement('div');
                    item.className = 'archive-item';
                    item.innerHTML = `
                        <div class="player-info">
                            <img src="${p.photo}" alt="p">
                            <span>${p.name}</span>
                        </div>
                        <button class="btn-mini restore" data-id="${p.name}">Bərpa</button>
                    `;
                    item.querySelector('.btn-mini.restore').addEventListener('click', () => {
                        db.ref('players/' + p.name).update({ status: "active" });
                    });
                    archiveDiv.appendChild(item);
                }
            });
            updateMainTriggerButtonState(activeCount);
        });

        db.ref('roles_config').on('value', snap => {
            const roles = snap.val() || {};
            if (Object.keys(roles).length === 0) {
                db.ref('roles_config').set({ "Mafia": 1, "Don": 1, "Həkim": 1, "Komissar": 1, "Sivil": 3 });
                return;
            }
            const configDiv = document.getElementById('roles-config-list');
            configDiv.innerHTML = "";

            Object.keys(roles).forEach(rName => {
                const count = roles[rName];
                const item = document.createElement('div');
                item.className = 'role-item';
                item.innerHTML = `
                    <span>${rName}</span>
                    <div class="role-controls">
                        <button class="btn-minus" data-id="${rName}">-</button>
                        <span style="min-width:20px; text-align:center; font-weight:bold;">${count}</span>
                        <button class="btn-plus" data-id="${rName}">+</button>
                        <button class="btn-mini" style="margin-left:10px; background:#7f8c8d;" data-del="${rName}">X</button>
                    </div>
                `;
                item.querySelector('.btn-minus').addEventListener('click', () => {
                    if (count > 0) db.ref('roles_config/' + rName).set(count - 1);
                });
                item.querySelector('.btn-plus').addEventListener('click', () => {
                    db.ref('roles_config/' + rName).set(count + 1);
                });
                item.querySelector('[data-del]').addEventListener('click', () => {
                    db.ref('roles_config/' + rName).remove();
                });
                configDiv.appendChild(item);
            });
        });

        // --- 5. SƏHİFƏ D: VƏZİFƏ PAYLAMA ---
        let isGameDistributed = false;
        db.ref('game_status/distributed').on('value', snap => {
            isGameDistributed = !!snap.val();
            db.ref('players').once('value', pSnap => {
                let actCount = 0;
                const pData = pSnap.val() || {};
                Object.values(pData).forEach(x => { if(x.status === 'active') actCount++; });
                updateMainTriggerButtonState(actCount);
            });
        });

        function updateMainTriggerButtonState(activeCount) {
            const btn = document.getElementById('main-distribute-btn');
            if (!btn) return;
            if (activeCount < 5) {
                btn.disabled = true;
                btn.innerText = `Oyunçu azdır (${activeCount}/5)`;
            } else if (isGameDistributed) {
                btn.disabled = true;
                btn.innerText = "Vəzifələr Paylanıb (Kilidli)";
            } else {
                btn.disabled = false;
                btn.innerText = "VƏZİFƏLƏRİ TƏYİN ET";
            }
        }

        const modal = document.getElementById('confirm-modal');
        document.getElementById('new-game-btn').addEventListener('click', () => { modal.style.display = 'flex'; });
        document.getElementById('modal-no').addEventListener('click', () => { modal.style.display = 'none'; });
        document.getElementById('modal-yes').addEventListener('click', () => {
            modal.style.display = 'none';
            db.ref('game_status/distributed').set(false);
            db.ref('chat').remove();
            db.ref('players').once('value', snap => {
                const players = snap.val() || {};
                const updates = {};
                Object.keys(players).forEach(k => {
                    updates['players/' + k + '/role'] = "Boşdur";
                });
                db.ref().update(updates);
            });
        });

        document.getElementById('main-distribute-btn').addEventListener('click', () => {
            if (isGameDistributed) return;
            db.ref('game_status/countdown_trigger').set(firebase.database.ServerValue.TIMESTAMP);
        });

        db.ref('game_status/countdown_trigger').on('value', snap => {
            if (!snap.val()) return;
            const overlay = document.getElementById('global-countdown-overlay');
            const numEl = document.getElementById('global-countdown-num');
            const banner = document.getElementById('global-start-banner');
            
            overlay.style.display = 'flex';
            let count = 5;
            numEl.innerText = count;

            const interval = setInterval(() => {
                count--;
                if (count > 0) {
                    numEl.innerText = count;
                } else {
                    clearInterval(interval);
                    overlay.style.display = 'none';
                    banner.style.display = 'block';
                    setTimeout(() => { banner.style.display = 'none'; }, 2000);

                    if (currentUsername === "Admin" || pages.D.classList.contains('active')) {
                        executeRoleDistribution();
                    }
                }
            }, 1000);
        });

        function executeRoleDistribution() {
            db.ref('roles_config').once('value', rSnap => {
                const rConfig = rSnap.val() || {};
                let rolePool = [];
                Object.keys(rConfig).forEach(rName => {
                    for(let i=0; i<rConfig[rName]; i++) { rolePool.push(rName); }
                });

                db.ref('players').once('value', pSnap => {
                    const players = pSnap.val() || {};
                    let activeKeys = Object.keys(players).filter(k => players[k].status === 'active');

                    for (let i = rolePool.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [rolePool[i], rolePool[j]] = [rolePool[j], rolePool[i]];
                    }

                    const updates = {};
                    activeKeys.forEach((pKey, index) => {
                        const assignedRole = rolePool[index] || "Sivil";
                        updates['players/' + pKey + '/role'] = assignedRole;
                    });

                    updates['game_status/distributed'] = true;
                    updates['game_status/countdown_trigger'] = null;
                    db.ref().update(updates);
                });
            });
        }

        // --- 6. SƏHİFƏ C: OYUNÇU KABİNETİ ---
        const sidebarTrigger = document.getElementById('sidebar-trigger');
        const sidebarPanel = document.getElementById('sidebar-panel');
        let isPanelOpen = false;

        function togglePanel() {
            isPanelOpen = !isPanelOpen;
            if (isPanelOpen) {
                sidebarPanel.classList.add('open');
                sidebarTrigger.innerText = "◀";
                sidebarTrigger.style.left = "13mm";
            } else {
                sidebarPanel.classList.remove('open');
                sidebarTrigger.innerText = "▶";
                sidebarTrigger.style.left = "0";
            }
        }

        sidebarTrigger.addEventListener('click', togglePanel);

        let touchStartX = 0;
        sidebarTrigger.addEventListener('touchstart', (e) => { touchStartX = e.touches.clientX; }, { passive: true });
        sidebarTrigger.addEventListener('touchend', (e) => {
            let touchEndX = e.changedTouches.clientX;
            let diffX = touchEndX - touchStartX;
            if (!isPanelOpen && diffX > 30) togglePanel();
            else if (isPanelOpen && diffX < -30) togglePanel();
        }, { passive: true });

        function listenToCabinetRole() {
            if (!currentUsername || currentUsername === "Admin") return;
            db.ref('players/' + currentUsername + '/role').on('value', snap => {
                const val = snap.val() || "Boşdur";
                const verticalHTML = val.split('').join('<br>');
                document.getElementById('cabinet-role-box').innerHTML = verticalHTML;
            });
        }

        db.ref('players').on('value', snap => {
            if (!currentUsername || currentUsername === "Admin") return;
            const players = snap.val() || {};
            const hzList = document.getElementById('hz-chat-list');
            if (!hzList) return;
            hzList.innerHTML = "";

            Object.keys(players).forEach(k => {
                const p = players[k];
                if (p.status === "active") {
                    if (p.name === currentUsername) return; 

                    const card = document.createElement('div');
                    card.className = 'hz-player-card';
                    if (selectedTargets.includes(p.name)) { card.classList.add('selected'); }
                    card.innerHTML = `
                        <img src="${p.photo}" alt="p">
                        <span>${p.name}</span>
                    `;
                    card.addEventListener('click', () => {
                        if (selectedTargets.includes(p.name)) {
                            selectedTargets = selectedTargets.filter(t => t !== p.name);
                            card.classList.remove('selected');
                        } else {
                            selectedTargets.push(p.name);
                            card.classList.add('selected');
                        }
                    });
                    hzList.appendChild(card);
                }
            });
        });

        document.getElementById('chat-send-btn').addEventListener('click', sendMessage);
        document.getElementById('chat-input-field').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        function sendMessage() {
            const input = document.getElementById('chat-input-field');
            const txt = input.value.trim();
            if (!txt || !currentUsername) return;

            const msgData = {
                sender: currentUsername,
                text: txt,
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                targets: selectedTargets.length > 0 ? selectedTargets : "all"
            };

            db.ref('chat').push(msgData).then(() => {
                input.value = "";
                selectedTargets = [];
                db.ref('players').keepSynced(true);
            });
        }

        db.ref('chat').on('value', snap => {
            if (!currentUsername || currentUsername === "Admin") return;
            const chatBox = document.getElementById('chat-messages-container');
            if (!chatBox) return;
            chatBox.innerHTML = "";
            const messages = snap.val() || {};

            Object.keys(messages).forEach(mKey => {
                const m = messages[mKey];
                const isAll = m.targets === "all";
                const isSender = m.sender === currentUsername;
                const isTarget = Array.isArray(m.targets) && m.targets.includes(currentUsername);

                if (isAll || isSender || isTarget) {
                    const div = document.createElement('div');
                    div.className = `msg ${isSender ? 'outgoing' : 'incoming'}`;
                    
                    let targetLabel = "";
                    if (Array.isArray(m.targets)) {
                        targetLabel = `<span class="msg-target">🔒 Özəl: ${m.targets.join(', ')}</span>`;
                    }
                    const timeStr = m.timestamp ? new Date(m.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : "";

                    div.innerHTML = `
                        <span class="msg-meta">${m.sender}</span>
                        <div>${m.text}</div>
                        ${targetLabel}
                        <span class="msg-time">${timeStr}</span>
                    `;
                    chatBox.appendChild(div);
                }
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    </script>
</body>
</html>
