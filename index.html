<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mafia Premium Control</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js">
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        :root {
            --app-height: 100vh;
        }
        body {
            background: #0a0a0a;
            color: #e0e0e0;
            height: var(--app-height);
            min-height: -webkit-fill-available;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: fixed;
            width: 100vw;
        }
        .page {
            display: none;
            width: 100vw;
            height: 100%;
            position: relative;
        }
        .page.active {
            display: flex;
            flex-direction: column;
        }
        #page-a {
            background: radial-gradient(circle, #1a1a1a 0%, #050505 100%);
            justify-content: center;
            align-items: center;
        }
        .login-btn-top {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #27ae60;
            color: white;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }
        .login-box {
            background: rgba(20, 20, 20, 0.9);
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #333;
            width: 90%;
            max-width: 360px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
            text-align: center;
            position: relative;
        }
        .login-box h2 {
            margin-bottom: 20px;
            color: #ff3333;
            letter-spacing: 2px;
        }
        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
            font-size: 16px;
        }
        .login-box button {
            width: 100%;
            padding: 12px;
            background: #ff3333;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .register-link {
            color: #5288c1;
            margin-top: 15px;
            display: inline-block;
            cursor: pointer;
            text-decoration: underline;
            font-size: 14px;
        }
        .register-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: var(--app-height);
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            overflow-y: auto;
            padding: 20px;
        }
        .register-box {
            background: #141414;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #333;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            text-align: center;
            max-height: 90vh;
            overflow-y: auto;
        }
        .register-box h3 {
            color: #ff3333;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        .register-box input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
        }
        .file-input-label {
            display: block;
            padding: 10px;
            background: #34495e;
            color: white;
            border-radius: 4px;
            margin-bottom: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        .file-input-label input {
            display: none;
        }
        #page-b {
            display: none;
            flex-direction: row;
            height: 100%;
        }
        #page-b.active {
            display: flex;
        }
        .admin-left,
        .admin-right {
            width: 50%;
            height: 100%;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .admin-left {
            border-right: 1px solid #333;
            background: #111;
        }
        .admin-right {
            background: #151515;
        }
        .admin-section {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #2a2a2a;
        }
        .admin-section h3 {
            margin-bottom: 10px;
            color: #ff3333;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
            font-size: 16px;
        }
        .admin-form input {
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
        }
        .admin-form button,
        .btn-action {
            width: 100%;
            padding: 10px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        .btn-action.danger {
            background: #c0392b;
        }
        .player-item,
        .archive-item,
        .role-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #252525;
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .player-item img,
        .archive-item img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 10px;
        }
        .player-info {
            display: flex;
            align-items: center;
        }
        .btn-mini {
            padding: 4px 8px;
            background: #c0392b;
            border: none;
            color: white;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-mini.restore {
            background: #2980b9;
        }
        .btn-mini.delete {
            background: #7f1a1a;
            margin-left: 4px;
        }
        .role-controls {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .role-controls button {
            width: 25px;
            height: 25px;
            background: #444;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 3px;
            cursor: pointer;
        }
        .camera-container {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: #222;
            padding: 10px;
            border-radius: 6px;
            margin-top: 5px;
            position: relative;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 240px;
            aspect-ratio: 4/3;
            background: #000;
            border-radius: 4px;
            overflow: hidden;
        }
        #video,
        #video-reg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        .shekerbura-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 130px;
            height: 180px;
            border: 3px dashed #ff3333;
            border-radius: 100px / 130px;
            pointer-events: none;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        .shekerbura-overlay.detected {
            border-color: #27ae60;
            border-style: solid;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.3);
        }
        .face-status-text {
            font-size: 11px;
            color: #ff3333;
            font-weight: bold;
            margin-top: 2px;
            text-align: center;
        }
        .face-status-text.detected {
            color: #27ae60;
        }
        .camera-btns {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .camera-btns button {
            flex: 1;
            padding: 8px;
            font-size: 12px;
        }
        .img-preview {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            display: none;
            margin: 5px auto;
            border: 1px solid #555;
        }
        #page-c {
            background: #0e1621;
            height: 100%;
            overflow: hidden;
            display: none;
            position: relative;
        }
        #page-c.active {
            display: flex;
            flex-direction: column;
        }
        .player-header {
            height: 60px;
            background: #17212b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            border-bottom: 1px solid #101921;
            flex-shrink: 0;
        }
        .player-header h2 {
            font-size: 18px;
            color: #fff;
        }
        .player-header img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #5288c1;
            object-fit: cover;
        }
        .sidebar-trigger {
            position: absolute;
            left: 0;
            top: 35%;
            width: 15px;
            height: 60px;
            background: #24303f;
            border-radius: 0 8px 8px 0;
            border: 1px solid #313e4f;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 12px;
            z-index: 99;
            touch-action: none;
        }
        .sidebar-panel {
            position: absolute;
            left: -100px;
            top: 35%;
            width: 13mm;
            height: auto;
            min-height: 25mm;
            background: #17212b;
            border: 1px solid #ff3333;
            box-shadow: 5px 0 15px rgba(0, 0, 0, 0.5);
            z-index: 98;
            border-radius: 0 6px 6px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 5px 0;
            transition: left 0.2s ease;
            overflow: hidden;
        }
        .sidebar-panel.open {
            left: 0;
        }
        .role-text-vertical {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            color: #ff3333;
            font-weight: bold;
            font-size: 10px;
            line-height: 1.1;
            letter-spacing: 0px;
            text-align: center;
            margin-bottom: 10px;
            cursor: default;
            touch-action: manipulation;
            user-select: none;
            -webkit-touch-callout: none;
            cursor: pointer; /* Baxışı dəyişir */
            -webkit-tap-highlight-color: transparent; /* Vurğunu silir */
        }
        .mafia-alliance-container {
            width: 100%;
            border-top: 1px dashed #ff3333;
            padding-top: 5px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .mafia-member-row {
            display: flex;
            align-items: center;
            gap: 4px;
            width: 90%;
            background: rgba(255, 51, 51, 0.1);
            padding: 3px;
            border-radius: 4px;
            overflow: hidden;
            touch-action: manipulation;
            transition: all 0.15s ease;
            transform-origin: center;
            will-change: transform;
        }
        .mafia-member-row img {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            transition: all 0.15s ease;
        }
        .mafia-member-row span {
            font-size: 8px;
            color: #ff8888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: left;
            font-weight: normal;
            transition: all 0.15s ease;
            user-select: none;
        }
        .mafia-member-row span.blurred {
            filter: blur(4px);
        }
        .mafia-member-row span.revealed {
            filter: blur(0);
        }

        /* Mafia Zoom Overlay - öz mövqeyindən sağa/aşağıya böyüyür */
        .mafia-zoom-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            display: none;
            background: transparent !important;
        }
        .mafia-zoom-container {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            gap: 1px;
            padding: 0;
            background: transparent !important;
            transform-origin: top left;
            transform: scale(3);
        }
        .mafia-zoom-item {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 1px;
            background: transparent !important;
        }
        .mafia-zoom-item img {
            width: 13px !important;
            height: 13px !important;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #ff333388;
            background: transparent !important;
            box-shadow: 0 0 6px rgba(255, 51, 51, 0.4);
        }
        .mafia-zoom-item span {
            color: #8b0000;
            font-size: 6px;
            font-weight: bold;
            text-shadow: 0 0 2px #fff, 0 0 1px #fff;
            background: transparent !important;
            text-align: center;
            white-space: nowrap;
        }

        .horizontal-list {
            height: 75px;
            background: #17212b;
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 0 15px;
            overflow-x: auto;
            border-bottom: 1px solid #101921;
            flex-shrink: 0;
            scrollbar-width: none;
        }
        .horizontal-list::-webkit-scrollbar {
            display: none;
        }
        .hz-player-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            min-width: 50px;
            position: relative;
        }
        .hz-player-card img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid transparent;
            transition: border-color 0.2s;
        }
        .hz-player-card.selected img {
            border-color: #ff3333;
        }
        .hz-player-card span {
            font-size: 11px;
            color: #7f91a4;
            margin-top: 4px;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
            max-width: 55px;
        }
        .all-icon-wrapper {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #24303f;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            border: 2px solid transparent;
        }
        .hz-player-card.all-selected .all-icon-wrapper {
            border-color: #27ae60;
            background: #2b5278;
        }
        .chat-area {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-repeat: repeat;
            -webkit-overflow-scrolling: touch;
        }
        .msg {
            max-width: 75%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.4;
            position: relative;
            word-break: break-word;
        }
        .msg.incoming {
            background: #182533;
            align-self: flex-start;
            color: #fff;
            border-bottom-left-radius: 2px;
        }
        .msg.outgoing {
            background: #2b5278;
            align-self: flex-end;
            color: #fff;
            border-bottom-right-radius: 2px;
        }
        .msg .msg-meta {
            font-size: 10px;
            color: #7f91a4;
            display: block;
            margin-bottom: 2px;
            font-weight: bold;
        }
        .msg .msg-target {
            font-size: 9px;
            color: #ff8888;
            font-style: italic;
            display: block;
            margin-top: 3px;
        }
        .msg .msg-time {
            font-size: 9px;
            color: #a1b2c4;
            text-align: right;
            display: block;
            margin-top: 2px;
        }
        .chat-input-bar {
            height: 65px;
            background: #17212b;
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 10px;
            border-top: 1px solid #101921;
            flex-shrink: 0;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .chat-input-bar input {
            flex: 1;
            padding: 12px 15px;
            background: #24303f;
            border: none;
            color: white;
            border-radius: 20px;
            font-size: 15px;
            outline: none;
        }
        .chat-input-bar button {
            width: 45px;
            height: 45px;
            background: #5288c1;
            border: none;
            color: white;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }
        #page-d {
            background: #0c0c0c;
            justify-content: center;
            align-items: center;
        }
        .btn-back-a {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #444;
            color: white;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-new-game {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #7f8c8d;
            color: white;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .main-trigger-btn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: #c0392b;
            border: 8px solid #962d22;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 0 30px rgba(192, 57, 43, 0.5);
            transition: all 0.3s;
            user-select: none;
        }
        .main-trigger-btn:disabled {
            background: #3a3a3a !important;
            border-color: #2b2b2b !important;
            color: #777 !important;
            cursor: not-allowed;
            box-shadow: none !important;
        }
        .countdown-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.1);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            pointer-events: none;
        }
        .countdown-number {
            font-size: 140px;
            font-weight: 900;
            color: #ff3333;
            text-shadow: 0 0 40px rgba(255, 51, 51, 0.8);
            font-family: Impact, sans-serif;
        }
        .start-announcement {
            font-size: 45px;
            font-weight: bold;
            color: #27ae60;
            text-shadow: 0 0 30px rgba(39, 174, 96, 0.8);
            text-align: center;
            display: none;
            font-family: 'Arial Black', sans-serif;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10000;
            width: 90%;
            pointer-events: none;
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .modal-box {
            background: #222;
            padding: 25px;
            border-radius: 6px;
            width: 280px;
            text-align: center;
            border: 1px solid #444;
        }
        .modal-box p {
            margin-bottom: 20px;
            font-size: 16px;
        }
        .modal-btns {
            display: flex;
            gap: 10px;
        }
        .modal-btns button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-yes {
            background: #c0392b;
            color: white;
        }
        .btn-no {
            background: #7f8c8d;
            color: white;
        }
        @media (max-width: 600px) {
            #page-b {
                flex-direction: column;
            }
            .admin-left,
            .admin-right {
                width: 100%;
                height: 50%;
            }
            .countdown-number {
                font-size: 100px;
            }
            .start-announcement {
                font-size: 32px;
            }
            .mafia-zoom-container {
                transform: scale(2.5);
                gap: 1px;
            }
            .mafia-zoom-item img {
                width: 12px !important;
                height: 12px !important;
            }
            .mafia-zoom-item span {
                font-size: 5px;
            }
        }
    </style>
</head>
<body>
    <div id="page-a" class="page active">
        <button id="nav-to-d-btn" class="login-btn-top">Vəzifə təyin et</button>
        <div class="login-box">
            <h2>MAFIA LOG IN</h2>
            <input type="text" id="login-username" placeholder="Adınız">
            <input type="password" id="login-password" placeholder="Şifrəniz">
            <button id="login-submit-btn">Daxil ol</button>
            <div id="open-register-overlay" class="register-link">Qeydiyyatdan keç</div>
        </div>
    </div>
    <div id="register-panel" class="register-overlay">
        <div class="register-box">
            <h3>YENİ QEYDİYYAT</h3>
            <input type="text" id="reg-name" placeholder="Oyunçu Adı">
            <input type="password" id="reg-pass" placeholder="Şifrə">
            <label class="file-input-label">
                📁 Qalereyadan Şəkil Seç
                <input type="file" id="reg-file-input" accept="image/*">
            </label>
            <button id="reg-camera-toggle-btn" style="background:#e67e22; margin-bottom:5px; width:100%; padding:10px; color:white; border:none; border-radius:4px; font-weight:bold; cursor:pointer;">📷 Kamera ilə Selfi Çək</button>
            <div class="camera-container" id="reg-cam-block">
                <div class="video-wrapper">
                    <video id="video-reg" autoplay playsinline></video>
                    <div class="shekerbura-overlay" id="reg-shekerbura"></div>
                </div>

    <script>
        function resetAppHeight() {

        window.addEventListener('orientationchange', resetAppHeight);

        let currentUsername = "";
        let selectedTargets = [];
        let isAllSelected = true;
        let localPhotoBase64 = "";
        let streamRef = null;
        let faceDetectionInterval = null;
        let pendingDeleteKey = null;
        let isMafiaZoomActive = false;
        let myCurrentRole = ""; // Oyunçunun həqiqi rolu — DOM-dan yox, birbaşa buradan oxunacaq

        document.getElementById('nav-to-d-btn').addEventListener('click', () => showPage('D'));
        document.getElementById('back-to-a-btn').addEventListener('click', () => showPage('A'));
        document.getElementById('logout-b-btn').addEventListener('click', () => { currentUsername = "";
            showPage('A'); });

        document.getElementById('login-submit-btn').addEventListener('click', () => {
            const u = document.getElementById('login-username').value.trim();
            const p = document.getElementById('login-password').value.trim();
            if (!u || !p) return;

            if (u === 'Admin' && p === '9060') {
                currentUsername = "Admin";
                showPage('B');

            }

            db.ref('players/' + u).once('value', snap => {
                const userData = snap.val();
                if (userData && userData.password === p && userData.status === "active") {
                    currentUsername = u;

                    document.getElementById('cabinet-avatar').src = userData.photo || "https://via.placeholder.com/150";
                    showPage('C');
                    loadChatHistoryAndListen();
                } else {
                    alert("Ad və ya şifrə yanlışdır, yaxud oyunçu aktiv deyil!");
                }
            });
        });

        function startFaceDetectionSimulated(videoElement, overlayElement, statusElement, buttonElement) {
            if (faceDetectionInterval) clearInterval(faceDetectionInterval);

            faceDetectionInterval = setInterval(() => {
                if (!streamRef || videoElement.paused || videoElement.ended) return;

                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = 60;
                tempCanvas.height = 65;
                const ctx = tempCanvas.getContext('2d');
                try {
                    ctx.drawImage(videoElement, 15, 10, 30, 45, 0, 0, 60, 65);
                    const imgData = ctx.getImageData(0, 0, 60, 65);
                    let rSum = 0,
                        gSum = 0,
                        bSum = 0,
                        skinMatchPixels = 0;

                    for (let i = 0; i < imgData.data.length; i += 4) {
                        let r = imgData.data[i];
                        let g = imgData.data[i + 1];
                        let b = imgData.data[i + 2];
                        rSum += r;
                        gSum += g;
                        bSum += b;

                        if (r > 60 && g > 40 && b > 20 && r > g && r > b && (r - g) > 15) {
                            skinMatchPixels++;
                        }
                    }

                    const totalPixels = imgData.data.length / 4;
                    const skinRatio = skinMatchPixels / totalPixels;
                    const avgR = rSum / totalPixels;
                    const avgG = gSum / totalPixels;
                    const avgB = bSum / totalPixels;

                    const isHumanFaceDetected = (skinRatio > 0.25 && skinRatio < 0.85) && (avgR > avgB + 10) && (Math.abs(
                    avgR - avgG) > 8);

                    if (isHumanFaceDetected) {
                        overlayElement.classList.add('detected');
                        statusElement.innerText = "Üz aşkarlandı. Çəkə bilərsiniz.";
                        statusElement.classList.add('detected');
                        buttonElement.disabled = false;
                    } else {
                        overlayElement.classList.remove('detected');
                        statusElement.innerText = "Üz tapılmadı! Şəkərbura çərçivəsinə yaxınlaşın.";
                        statusElement.classList.remove('detected');
                        buttonElement.disabled = true;
                    }
                } catch (e) {}
            }, 300);
        }

        function setupCameraModule(toggleBtnId, blockId, videoId, overlayId, statusId, snapBtnId, retakeBtnId, previewId) {
            const toggleBtn = document.getElementById(toggleBtnId);
            const block = document.getElementById(blockId);
            const videoEl = document.getElementById(videoId);
            const overlayEl = document.getElementById(overlayId);
            const statusEl = document.getElementById(statusId);
            const snapBtn = document.getElementById(snapBtnId);
            const retakeBtn = document.getElementById(retakeBtnId);
            const preview = document.getElementById(previewId);

            toggleBtn.addEventListener('click', async () => {
                if (block.style.display === 'flex') {
                    stopCamera(toggleBtnId.includes('reg') ? 'reg' : 'admin');
                } else {
                    block.style.display = 'flex';
                    preview.style.display = 'none';
                    videoEl.style.display = 'block';
                    snapBtn.style.display = 'block';
                    retakeBtn.style.display = 'none';

                    try {
                        streamRef = await navigator.mediaDevices.getUserMedia({
                            video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
                            audio: false
                        });
                        videoEl.srcObject = streamRef;
                        startFaceDetectionSimulated(videoEl, overlayEl, statusEl, snapBtn);
                    } catch (err) {
                        alert("Kameraya giriş icazəsi rədd edildi!");
                        block.style.display = 'none';
                    }
                }
            });

            snapBtn.addEventListener('click', () => {
                if (!streamRef || snapBtn.disabled) return;
                if (faceDetectionInterval) clearInterval(faceDetectionInterval);

                const canvasEl = document.createElement('canvas');
                canvasEl.width = videoEl.videoWidth || 320;
                canvasEl.height = videoEl.videoHeight || 240;
                const ctx = canvasEl.getContext('2d');

                ctx.translate(canvasEl.width, 0);
                ctx.scale(-1, 1);
                ctx.drawImage(videoEl, 0, 0, canvasEl.width, canvasEl.height);

                localPhotoBase64 = canvasEl.toDataURL('image/jpeg', 0.6);
                preview.src = localPhotoBase64;
                preview.style.display = 'block';

                videoEl.style.display = 'none';
                snapBtn.style.display = 'none';
                overlayEl.style.display = 'none';
                retakeBtn.style.display = 'block';
                statusEl.innerText = "Şəkil uğurla qeydə alındı.";
            });

            retakeBtn.addEventListener('click', () => {
                localPhotoBase64 = "";
                preview.style.display = 'none';
                videoEl.style.display = 'block';
                overlayEl.style.display = 'block';
                snapBtn.style.display = 'block';
                snapBtn.disabled = true;
                retakeBtn.style.display = 'none';
                startFaceDetectionSimulated(videoEl, overlayEl, statusEl, snapBtn);
            });
        }

        setupCameraModule('camera-toggle-btn', 'cam-block', 'video', 'admin-shekerbura', 'admin-face-status', 'snap-btn',
            'retake-btn', 'captured-preview');
        setupCameraModule('reg-camera-toggle-btn', 'reg-cam-block', 'video-reg', 'reg-shekerbura', 'reg-face-status',
            'reg-snap-btn', 'reg-retake-btn', 'reg-captured-preview');

        function stopCamera(type) {
            if (faceDetectionInterval) { clearInterval(faceDetectionInterval);
                faceDetectionInterval = null; }
            if (streamRef) {
                streamRef.getTracks().forEach(track => track.stop());
                streamRef = null;
            }
            localPhotoBase64 = "";

            const block = document.getElementById(type === 'reg' ? 'reg-cam-block' : 'cam-block');
            const videoEl = document.getElementById(type === 'reg' ? 'video-reg' : 'video');
            const overlayEl = document.getElementById(type === 'reg' ? 'reg-shekerbura' : 'admin-shekerbura');
            const snapBtn = document.getElementById(type === 'reg' ? 'reg-snap-btn' : 'snap-btn');
            const retakeBtn = document.getElementById(type === 'reg' ? 'reg-retake-btn' : 'retake-btn');
            const preview = document.getElementById(type === 'reg' ? 'reg-captured-preview' : 'captured-preview');
            const statusEl = document.getElementById(type === 'reg' ? 'reg-face-status' : 'admin-face-status');

            if (videoEl) videoEl.srcObject = null;
            if (block) block.style.display = 'none';
            if (videoEl) videoEl.style.display = 'block';
            if (overlayEl) { overlayEl.style.display = 'block';
                overlayEl.classList.remove('detected'); }
            if (snapBtn) { snapBtn.style.display = 'block';
                snapBtn.disabled = true; }
            if (retakeBtn) retakeBtn.style.display = 'none';
            if (preview) preview.style.display = 'none';
            if (statusEl) { statusEl.innerText = "Üz çərçivəyə uyğunlaşdırılmalıdır";
                statusEl.classList.remove('detected'); }
        }

        function handleFileSelection(inputElement, previewImgId) {
            inputElement.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = function() {
                        const canvasEl = document.createElement('canvas');
                        const maxDim = 200;
                        let w = img.width,
                            h = img.height;
                        if (w > h) { if (w > maxDim) { h *= maxDim / w;
                                w = maxDim; } } else { if (h > maxDim) { w *= maxDim / h;
                                h = maxDim; } }
                        canvasEl.width = w;
                        canvasEl.height = h;
                        canvasEl.getContext('2d').drawImage(img, 0, 0, w, h);

                        localPhotoBase64 = canvasEl.toDataURL('image/jpeg', 0.6);
                        const prev = document.getElementById(previewImgId);
                        prev.src = localPhotoBase64;
                        prev.style.display = 'block';
                    };
                };
                reader.readAsDataURL(file);
            });
        }
        handleFileSelection(document.getElementById('admin-file-input'), 'captured-preview');
        handleFileSelection(document.getElementById('reg-file-input'), 'reg-captured-preview');

        document.getElementById('submit-register-btn').addEventListener('click', () => {
            const name = document.getElementById('reg-name').value.trim();
            const pass = document.getElementById('reg-pass').value.trim();

            if (!name || !pass || !localPhotoBase64) {
                alert("Qeydiyyat xətası! Ad, şifrə və şəkil mütləqdir.");
                return;
            }

            db.ref('players/' + name).set({
                name: name,
                password: pass,
                photo: localPhotoBase64,
                status: "active",
                role: "Boşdur"
            }).then(() => {
                alert("Qeydiyyatınız tamamlandı!");
                document.getElementById('reg-name').value = "";
                document.getElementById('reg-pass').value = "";
                document.getElementById('register-panel').style.display = 'none';
                stopCamera('reg');

        document.getElementById('add-player-btn').addEventListener('click', () => {
            const name = document.getElementById('p-name').value.trim();
            const pass = document.getElementById('p-pass').value.trim();
            if (!name || !pass) { alert("Ad və şifrə mütləqdir!"); return; }

            const finalPhoto = localPhotoBase64 || "https://via.placeholder.com/150";

            db.ref('players/' + name).set({
                name: name,
                password: pass,
                photo: finalPhoto,
                status: "active",
                role: "Boşdur"

                document.getElementById('p-name').value = "";
                document.getElementById('p-pass').value = "";
                stopCamera('admin');

        });

        document.getElementById('add-custom-role-btn').addEventListener('click', () => {
            const rName = document.getElementById('new-role-name').value.trim();
            if (!rName) return;
            db.ref('roles_config/' + rName).set(1).then(() => {
                document.getElementById('new-role-name').value = "";

        });

        db.ref('players').on('value', snap => {
            const players = snap.val() || {};
            const activeDiv = document.getElementById('active-players-list');
            const archiveDiv = document.getElementById('archive-players-list');
            activeDiv.innerHTML = "";
            archiveDiv.innerHTML = "";

            let activeCount = 0;

            Object.keys(players).forEach(key => {
                const p = players[key];
                const isCorrupted = !p || !p.name || p.name === "undefined" || !p.photo;

                if (p.status === "active" && !isCorrupted) {
                    activeCount++;
                    const item = document.createElement('div');
                    item.className = 'player-item';
                    item.innerHTML = `
                                <div class="player-info">
                                    <img src="${p.photo}" alt="p">
                                    <div><strong>${p.name}</strong> <br><small style="color:#aaa;">Rol: ${p.role || 'Boşdur'}</small></div>
                                </div>
                                <button class="btn-mini" data-id="${p.name}">Sil</button>
                            `;
                    item.querySelector('.btn-mini').addEventListener('click', () => {
                        db.ref('players/' + p.name).update({ status: "archived" });
                    });
                    activeDiv.appendChild(item);
                } else if (p.status === "archived" && !isCorrupted) {
                    const item = document.createElement('div');
                    item.className = 'archive-item';
                    item.innerHTML = `
                                <div class="player-info">
                                    <img src="${p.photo}" alt="p">
                                    <span>${p.name}</span>
                                </div>
                                <div>
                                    <button class="btn-mini restore" data-id="${p.name}">Bərpa</button>
                                    <button class="btn-mini delete" data-id="${p.name}">Sil</button>
                                </div>
                            `;
                    item.querySelector('.btn-mini.restore').addEventListener('click', () => {
                        db.ref('players/' + p.name).update({ status: "active" });
                    });
                    item.querySelector('.btn-mini.delete').addEventListener('click', () => {
                        pendingDeleteKey = p.name;
                        document.getElementById('modal-message').textContent = `"${p.name}" oyunçusunu silmək istədiyinizə əminsinizmi?`;
                        document.getElementById('confirm-modal').style.display = 'flex';
                    });
                    archiveDiv.appendChild(item);
                } else {
                    const item = document.createElement('div');
                    item.className = 'player-item';
                    item.style.border = "1px dashed #ff3333";
                    item.innerHTML = `
                                <span style="color:#ff8888; font-size:11px;">[Köhnə Data: ${key}]</span>
                                <button class="btn-mini" style="background:#ff3333;">Sil</button>
                            `;
                    item.querySelector('button').addEventListener('click', () => {
                        db.ref('players/' + key).remove();
                    });
                    activeDiv.appendChild(item);
                }
            });

            updateMainTriggerButtonState(activeCount);
        });

        db.ref('roles_config').on('value', snap => {
            const roles = snap.val() || {};
            if (Object.keys(roles).length === 0) {
                db.ref('roles_config').set({ "Mafia": 1, "Don": 1, "Həkim": 1, "Komissar": 1, "Sivil": 2 });
                return;
            }
            const configDiv = document.getElementById('roles-config-list');
            configDiv.innerHTML = "";

            Object.keys(roles).forEach(rName => {
                const count = roles[rName];
                const item = document.createElement('div');
                item.className = 'role-item';
                item.innerHTML = `
                            <span>${rName}</span>
                            <div class="role-controls">
                                <button class="btn-minus" data-id="${rName}">-</button>
                                <span style="min-width:20px; text-align:center; font-weight:bold;">${count}</span>
                                <button class="btn-plus" data-id="${rName}">+</button>
                                <button class="btn-mini" style="margin-left:10px; background:#7f8c8d;" data-del="${rName}">X</button>
                            </div>
                        `;
                item.querySelector('.btn-minus').addEventListener('click', () => {
                    if (count > 0) db.ref('roles_config/' + rName).set(count - 1);
                });
                item.querySelector('.btn-plus').addEventListener('click', () => {
                    db.ref('roles_config/' + rName).set(count + 1);
                });
                item.querySelector('[data-del]').addEventListener('click', () => {
                    db.ref('roles_config/' + rName).remove();
                });
                configDiv.appendChild(item);
            });
        });

        let isGameDistributed = false;
        db.ref('game_status/distributed').on('value', snap => {
            isGameDistributed = !!snap.val();
            db.ref('players').once('value', pSnap => {
                let actCount = 0;
                const pData = pSnap.val() || {};
                Object.values(pData).forEach(x => { if (x && x.status === 'active' && x.name && x.photo) actCount++; });
                updateMainTriggerButtonState(actCount);
            });
        });

        function updateMainTriggerButtonState(activeCount) {
            const btn = document.getElementById('main-distribute-btn');
            if (!btn) return;
            if (activeCount < 5) {
                btn.disabled = true;
                btn.innerText = `Oyunçu azdır (${activeCount}/5)`;
            } else if (isGameDistributed) {
                btn.disabled = true;
                btn.innerText = "Vəzifələr Paylanıb";
            } else {
                btn.disabled = false;
                btn.innerText = "VƏZİFƏLƏRİ TƏYİN ET";
            }
        }

        const modal = document.getElementById('confirm-modal');
        document.getElementById('new-game-btn').addEventListener('click', () => {
            document.getElementById('modal-message').textContent = "Əminsinizmi? Bütün rollar və çat sıfırlanacak.";
            modal.style.display = 'flex';
        });
        document.getElementById('modal-no').addEventListener('click', () => {
            modal.style.display = 'none';
            pendingDeleteKey = null;
        });
        document.getElementById('modal-yes').addEventListener('click', () => {
            modal.style.display = 'none';

            if (pendingDeleteKey) {
                db.ref('players/' + pendingDeleteKey).remove().then(() => {
                    pendingDeleteKey = null;
                });
                return;
            }

            db.ref('game_status/distributed').set(false);
            db.ref('chat').remove();
            db.ref('players').once('value', snap => {
                const players = snap.val() || {};
                const updates = {};
                Object.keys(players).forEach(k => {
                    updates['players/' + k + '/role'] = "Boşdur";
                });
                db.ref().update(updates);
            });
        });

        document.getElementById('main-distribute-btn').addEventListener('click', () => {
            if (isGameDistributed) return;
            db.ref('game_status/countdown_trigger').set(firebase.database.ServerValue.TIMESTAMP);
        });

        db.ref('game_status/countdown_trigger').on('value', snap => {
            if (!snap.val()) return;
            const overlay = document.getElementById('global-countdown-overlay');
            const numEl = document.getElementById('global-countdown-num');
            const banner = document.getElementById('global-start-banner');

            overlay.style.display = 'flex';
            let count = 5;
            numEl.innerText = count;

            const interval = setInterval(() => {
                count--;
                if (count > 0) {
                    numEl.innerText = count;
                } else {
                    clearInterval(interval);
                    overlay.style.display = 'none';
                    banner.style.display = 'block';
                    setTimeout(() => { banner.style.display = 'none'; }, 2000);

                    if (currentUsername === "Admin" || pages.D.classList.contains('active')) {
                        executeRoleDistribution();
                    }
                }
            }, 1000);
        });

        function executeRoleDistribution() {
            db.ref('roles_config').once('value', rSnap => {
                const rConfig = rSnap.val() || {};
                let rolePool = [];
                Object.keys(rConfig).forEach(rName => {
                    for (let i = 0; i < rConfig[rName]; i++) rolePool.push(rName);
                });

                db.ref('players').once('value', pSnap => {
                    const players = pSnap.val() || {};
                    let activeKeys = Object.keys(players).filter(k => players[k].status === 'active' && players[k]
                        .name && players[k].photo);

                    for (let i = rolePool.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [rolePool[i], rolePool[j]] = [rolePool[j], rolePool[i]];
                    }

                    const updates = {};
                    activeKeys.forEach((pKey, index) => {
                        updates['players/' + pKey + '/role'] = rolePool[index] || "Sivil";
                    });

                    updates['game_status/distributed'] = true;
                    updates['game_status/countdown_trigger'] = null;
                    db.ref().update(updates);
                });
            });
        }

        const sidebarTrigger = document.getElementById('sidebar-trigger');
        const sidebarPanel = document.getElementById('sidebar-panel');
        let isPanelOpen = false;

        function togglePanel() {
            isPanelOpen = !isPanelOpen;
            if (isPanelOpen) {
                sidebarPanel.classList.add('open');
                sidebarTrigger.innerText = "◀";
                sidebarTrigger.style.left = "13mm";
            } else {
                sidebarPanel.classList.remove('open');
                sidebarTrigger.innerText = "▶";
                sidebarTrigger.style.left = "0";
            }
        }
        sidebarTrigger.addEventListener('click', togglePanel);

        let touchStartX = 0;
        sidebarTrigger.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; }, { passive: true });
        sidebarTrigger.addEventListener('touchend', (e) => {
            let diffX = e.changedTouches[0].clientX - touchStartX;
            if (!isPanelOpen && diffX > 30) togglePanel();
            else if (isPanelOpen && diffX < -30) togglePanel();
        }, { passive: true });

        // ===================== MAFIA ZOOM - FIXED =====================
        function getMafiaAllies() {
            const alliancePanel = document.getElementById('mafia-alliance-panel');
            const rows = alliancePanel.querySelectorAll('.mafia-member-row');
            const members = [];
            rows.forEach(row => {
                const img = row.querySelector('img');
                const span = row.querySelector('span');
                if (img && span && span.textContent) {
                    members.push({
                        photo: img.src,
                        name: span.textContent
                    });
                }
            });
            return members;
        }

        function showMafiaZoom(mafiaMembers) {
            const overlay = document.getElementById('mafia-zoom-overlay');
            const container = document.getElementById('mafia-zoom-container');
            container.innerHTML = '';

            if (!mafiaMembers || mafiaMembers.length === 0) {
                overlay.style.display = 'none';
                return;
            }

            // Konteyneri orijinal siyahının (mafia-alliance-panel) tam üstünə qoyuruq
            // ki, böyümə elə həmin nöqtədən sağa/aşağıya doğru baş versin
            const sourcePanel = document.getElementById('mafia-alliance-panel');
            const rect = sourcePanel.getBoundingClientRect();
            container.style.left = rect.left + 'px';
            container.style.top = rect.top + 'px';

            mafiaMembers.forEach(member => {
                const item = document.createElement('div');
                item.className = 'mafia-zoom-item';
                item.innerHTML = `
                            <img src="${member.photo}" alt="${member.name}">
                            <span>${member.name}</span>
                        `;
                container.appendChild(item);
            });

            overlay.style.display = 'block';
            isMafiaZoomActive = true;
        }

        function hideMafiaZoom() {
            document.getElementById('mafia-zoom-overlay').style.display = 'none';
            document.getElementById('mafia-zoom-container').innerHTML = '';
            isMafiaZoomActive = false;
        }

        const roleTextEl = document.getElementById('cabinet-role-box');
        let holdTimer = null;

        function startMafiaZoom() {
            // DOM-un innerText-i etibarsızdır (<br> newline-a çevrilir), ona görə dəyişəndən oxuyuruq
            const role = myCurrentRole.toLowerCase().trim();
            if (role === 'mafia' || role === 'don') {
                // Hər dəfə siyahını yenidən oxu
                const mafiaMembers = getMafiaAllies();
                if (mafiaMembers && mafiaMembers.length > 0) {
                    showMafiaZoom(mafiaMembers);
                }
            }
        }
        function stopMafiaZoom() {
            if (holdTimer) {
                clearTimeout(holdTimer);
                holdTimer = null;
            }
            hideMafiaZoom();
        }

        // Touch events with improved responsiveness
        roleTextEl.addEventListener('touchstart', (e) => {
            // Small delay to ensure UI is ready
            holdTimer = setTimeout(startMafiaZoom, 100);
        }, { passive: true });

        roleTextEl.addEventListener('touchend', () => {
            stopMafiaZoom();
        }, { passive: true });

        roleTextEl.addEventListener('touchcancel', () => {
            stopMafiaZoom();
        }, { passive: true });

        // Mouse events for desktop
        roleTextEl.addEventListener('mousedown', (e) => {
            holdTimer = setTimeout(startMafiaZoom, 100);
        });

        roleTextEl.addEventListener('mouseup', () => {
            stopMafiaZoom();
        });

        roleTextEl.addEventListener('mouseleave', () => {
            stopMafiaZoom();
        });

        // ===================== OPTIMIZED SENSITIVE WORD FILTER =====================
        const sensitivePatterns = [
            'sivil', 'həkim', 'həkin', 'kamekadze', 'kamekadzi', 'komissar', 'vətəndaş', 'dedektiv',
            'mafiya', 'don', 'hakim', 'doktor', 'polis', 'müstəntiq', 'casus', 'qatil',
            'civil', 'doctor', 'kamikaze', 'commissioner', 'citizen', 'detective', 'mafia',
            'police', 'investigator', 'spy', 'killer', 'sheriff', 'judge', 'lawyer',
            'сивил', 'хəким', 'камикадзе', 'комиссар', 'детектив', 'мафия',
            'доктор', 'полиция', 'следователь', 'шпион', 'убийца', 'шериф', 'судья',
            'hekim', 'komiser', 'mafya', 'müfettiş', 'katil', 'şerif',
            'hekım', 'hekïm', 'hekîm', 'doxtor', 'kamisadze', 'kamisadzi',
            'komisar', 'detektiv', 'detektif', 'civıl', 'cıvıl', 'sıvıl', 'sivıl'
        ];

        function buildSensitiveRegex() {
            const obfuscatedPatterns = [];
            const leetMap = {
                'a': '[a@4аαΛ]',
                'e': '[e3еεξ]',
                'i': '[i1!ıіι|]',
                'o': '[o0оσø]',
                'u': '[uüуυµ]',
                's': '[s5$şṡ]',
                't': '[t7ţṭ]',
                'c': '[cçċ]',
                'g': '[gğġ]',
                'd': '[dđḍ]',
                'k': '[kκķ]',
                'm': '[mμ]',
                'n': '[nη]',
                'r': '[rρ]',
                'v': '[vν]',
                'y': '[yγ]'
            };

            sensitivePatterns.forEach(word => {
                let pattern = '';
                for (const char of word.toLowerCase()) {
                    if (leetMap[char]) {
                        pattern += leetMap[char];
                    } else {
                        pattern += char;
                    }
                }
                const sepPattern = pattern.split('').join('[^a-z0-9]*');
                obfuscatedPatterns.push(sepPattern);
            });

            const regexString = obfuscatedPatterns.map(p => `(?:^|[^a-z0-9])${p}(?:$|[^a-z0-9])`).join('|');
            return new RegExp(regexString, 'i');
        }

        const sensitiveRegex = buildSensitiveRegex();

        function containsSensitiveWord(text) {
            if (!text || text.length < 3) return false;
            return sensitiveRegex.test(text);
        }

        function filterSensitiveMessage(text) {
            if (containsSensitiveWord(text)) {
                return '🔒 [Məxfi məlumat bloklandı]';
            }
            return text;
        }

        // ===================== CHAT FUNCTIONS - FULLY OPTIMIZED =====================
        function loadChatHistoryAndListen() {
            if (!currentUsername || currentUsername === "Admin") return;
            const chatBox = document.getElementById('chat-messages-container');
            chatBox.innerHTML = "";

            // Load initial messages with filter
            db.ref('chat').once('value', snapshot => {
                const messages = snapshot.val() || {};
                Object.keys(messages).forEach(key => {
                    const msg = messages[key];
                    // Apply filter to existing messages
                    if (msg && msg.text) {
                        msg.text = filterSensitiveMessage(msg.text);
                    }
                    appendMessage(msg);
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            });

            // Listen for new messages only
            db.ref('chat').on('child_added', snapshot => {
                const msg = snapshot.val();
                if (msg) {
                    // Apply filter to new messages
                    if (msg.text) {
                        msg.text = filterSensitiveMessage(msg.text);
                    }
                    appendMessage(msg);
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            });

            listenToCabinetPlayersAndRoles();
        }

        function appendMessage(m) {
            const chatBox = document.getElementById('chat-messages-container');
            if (!m || !m.sender) return;

            const isAll = m.targets === "all";
            const isSender = m.sender === currentUsername;
            const isTarget = Array.isArray(m.targets) && m.targets.includes(currentUsername);

            if (!(isAll || isSender || isTarget)) return;

            const div = document.createElement('div');
            div.className = `msg ${isSender ? 'outgoing' : 'incoming'}`;

            let targetLabel = "";
            if (Array.isArray(m.targets)) {
                targetLabel = `<span class="msg-target">🔒 Özəl: ${m.targets.join(', ')}</span>`;
            }

            const timeStr = m.timestamp ? new Date(m.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "";

            // Use filtered text (already applied in load/child_added)
            const displayText = m.text || '';

            div.innerHTML = `
                        <span class="msg-meta">${m.sender}</span>
                        <div>${displayText}</div>
                        ${targetLabel}
                        <span class="msg-time">${timeStr}</span>
                    `;
            chatBox.appendChild(div);
        }

        function listenToCabinetPlayersAndRoles() {
            db.ref('players').on('value', snap => {
                const allPlayers = snap.val() || {};
                const myData = allPlayers[currentUsername];
                if (!myData) return;

                const myRole = myData.role || "Boşdur";
                myCurrentRole = myRole; // Əsl rolu saxla (zoom yoxlaması üçün)
                document.getElementById('cabinet-role-box').innerHTML = myRole.split('').join('<br>');

                const alliancePanel = document.getElementById('mafia-alliance-panel');
                alliancePanel.innerHTML = "";

                const isMafiaFaction = (myRole.toLowerCase() === "mafia" || myRole.toLowerCase() === "don");

                if (isMafiaFaction) {
                    alliancePanel.style.display = "flex";
                    let mafiaCount = 0;
                    Object.keys(allPlayers).forEach(k => {
                        const p = allPlayers[k];
                        if (p.status === "active" && p.name !== currentUsername) {
                            const rLower = (p.role || "").toLowerCase();
                            if (rLower === "mafia" || rLower === "don") {
                                const row = document.createElement('div');
                                row.className = 'mafia-member-row';
                                row.innerHTML = `
                                            <img src="${p.photo}" alt="m">
                                            <span class="blurred">${p.name}</span>
                                        `;
                                alliancePanel.appendChild(row);
                                mafiaCount++;
                            }
                        }
                    });
                } else {
                    alliancePanel.style.display = "none";
                }

                // Update horizontal list
                const hzList = document.getElementById('hz-chat-list');
                hzList.innerHTML = "";

                const allCard = document.createElement('div');
                allCard.className = `hz-player-card ${isAllSelected ? 'all-selected' : ''}`;
                allCard.innerHTML = `
                            <div class="all-icon-wrapper">ALL</div>
                            <span>Hamı</span>
                        `;
                allCard.addEventListener('click', () => {
                    isAllSelected = true;
                    selectedTargets = [];
                    document.querySelectorAll('.hz-player-card').forEach(c => c.classList.remove('selected'));
                    allCard.classList.add('all-selected');
                });
                hzList.appendChild(allCard);

                Object.keys(allPlayers).forEach(k => {
                    const p = allPlayers[k];
                    if (p.status === "active" && p.name && p.photo) {
                        if (p.name === currentUsername) return;

                        const card = document.createElement('div');
                        card.className = 'hz-player-card';
                        if (selectedTargets.includes(p.name)) card.classList.add('selected');

                        card.innerHTML = `
                                    <img src="${p.photo}" alt="p">
                                    <span>${p.name}</span>
                                `;

                        card.addEventListener('click', () => {
                            isAllSelected = false;
                            allCard.classList.remove('all-selected');

                            if (selectedTargets.includes(p.name)) {
                                selectedTargets = selectedTargets.filter(t => t !== p.name);
                                card.classList.remove('selected');
                                if (selectedTargets.length === 0) {
                                    isAllSelected = true;
                                    allCard.classList.add('all-selected');
                                    resetAppHeight();
                                }
                            } else {
                                selectedTargets.push(p.name);
                                card.classList.add('selected');
                            }
                        });
                        hzList.appendChild(card);
                    }
                });
            });
        }

        document.getElementById('chat-send-btn').addEventListener('click', sendMessage);
        document.getElementById('chat-input-field').addEventListener('keypress', (e) => { if (e.key === 'Enter')
                sendMessage(); });

        function sendMessage() {
            const input = document.getElementById('chat-input-field');
            const txt = input.value.trim();
            if (!txt || !currentUsername) return;

            // Apply filter before sending
            const filteredText = filterSensitiveMessage(txt);

            const msgData = {
                sender: currentUsername,
                text: filteredText,
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                targets: selectedTargets.length > 0 ? selectedTargets : "all"
            };

            db.ref('chat').push(msgData).then(() => {
                input.value = "";
                resetAppHeight();
            });
        }

        // ===================== Hold to reveal for mafia members =====================
        document.addEventListener('touchstart', (e) => {
            const target = e.target;
            if (target.closest && target.closest('.mafia-member-row')) {
                const row = target.closest('.mafia-member-row');
                const nameSpan = row.querySelector('span');
                if (nameSpan) {
                    nameSpan.classList.remove('blurred');
                    nameSpan.classList.add('revealed');
                }
            }
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
            const target = e.target;
            if (target.closest && target.closest('.mafia-member-row')) {
                const row = target.closest('.mafia-member-row');
                const nameSpan = row.querySelector('span');
                if (nameSpan) {
                    nameSpan.classList.add('blurred');
                    nameSpan.classList.remove('revealed');
                }
            }
        }, { passive: true });

        document.addEventListener('mousedown', (e) => {
            const target = e.target;
            if (target.closest && target.closest('.mafia-member-row')) {
                const row = target.closest('.mafia-member-row');
                const nameSpan = row.querySelector('span');
                if (nameSpan) {
                    nameSpan.classList.remove('blurred');
                    nameSpan.classList.add('revealed');
                }
            }
        });

        document.addEventListener('mouseup', (e) => {
            const target = e.target;
            if (target.closest && target.closest('.mafia-member-row')) {
                const row = target.closest('.mafia-member-row');
                const nameSpan = row.querySelector('span');
                if (nameSpan) {
                    nameSpan.classList.add('blurred');
                    nameSpan.classList.remove('revealed');
                }
            }
        });
    </script>
